<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe</title>
<style>
  body { font-family: system-ui, sans-serif; text-align: center; margin: 1rem; color: #111; }
  #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(90vw, 320px); margin: 1rem auto; }
  .cell { aspect-ratio: 1; font-size: 2.5rem; font-weight: bold; background: #fff; border: 2px solid #333; border-radius: 8px; cursor: pointer; }
  .cell[aria-disabled="true"] { cursor: default; color: #111; }
  .cell:focus-visible, #restart:focus-visible { outline: 3px solid #0057d9; outline-offset: 2px; }
  #restart { font-size: 1rem; padding: .6rem 1.2rem; min-height: 44px; }
  #status { font-size: 1.25rem; min-height: 1.5em; }
</style>
</head>
<body>
<h1>Tic-Tac-Toe</h1>
<p id="status" aria-live="polite"></p>
<div id="board"></div>
<button id="restart" type="button">Restart</button>
<script>
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function winner(b) {
  for (const [x, y, z] of LINES) if (b[x] && b[x] === b[y] && b[x] === b[z]) return b[x];
  return b.every(Boolean) ? 'draw' : null;
}
// Self-check: row, column, diagonal, draw, in-progress.
console.assert(winner(['X','X','X',null,'O','O',null,null,null]) === 'X', 'row');
console.assert(winner(['O','X',null,'O','X',null,'O',null,null]) === 'O', 'column');
console.assert(winner(['X','O',null,'O','X',null,null,null,'X']) === 'X', 'diagonal');
console.assert(winner(['X','O','X','X','O','O','O','X','X']) === 'draw', 'draw');
console.assert(winner(['X',null,null,null,'O',null,null,null,null]) === null, 'in progress');

let board, turn;
const $ = id => document.getElementById(id);
function render() {
  const w = winner(board);
  $('status').textContent = w === 'draw' ? "It's a draw!" : w ? w + ' wins!' : turn + "'s turn";
  [...$('board').children].forEach((c, i) => {
    c.textContent = board[i] || '';
    c.setAttribute('aria-disabled', !!(board[i] || w));
    c.setAttribute('aria-label', 'Cell ' + (i + 1) + ', ' + (board[i] || 'empty'));
  });
}
function play(i) {
  if (board[i] || winner(board)) return;
  board[i] = turn;
  turn = turn === 'X' ? 'O' : 'X';
  render();
}
function reset() { board = Array(9).fill(null); turn = 'X'; render(); }
for (let i = 0; i < 9; i++) {
  const c = document.createElement('button');
  c.className = 'cell'; c.type = 'button';
  c.onclick = () => play(i);
  $('board').append(c);
}
$('restart').onclick = reset;
reset();
</script>
</body>
</html>
